<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spring Celebrations - Vocab Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Prompt:wght@500;700&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- เชื่อมต่อระบบบันทึกคะแนน Google Sheets -->
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --emerald: #10b981;
            --emerald-dark: #059669;
            --magenta: #ec4899;
            --magenta-dark: #be185d;
            --sun: #f59e0b;
            --sun-dark: #d97706;
            --ink: #1e293b;
            --bg-top: #ecfdf5;
            --bg-bottom: #fdf2f8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 12px 12px 36px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink);
            background: linear-gradient(160deg, var(--bg-top) 0%, #fefce8 50%, var(--bg-bottom) 100%);
        }

        /* Profile Bar */
        .profile-bar {
            width: 100%;
            max-width: 660px;
            font-size: clamp(12px, 3.2vw, 14px);
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #a7f3d0;
            padding: 8px 14px;
            border-radius: 20px;
            color: #065f46;
            font-weight: 700;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
        }

        .btn-switch {
            background: var(--magenta);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 700;
            font-size: 12px;
        }

        /* Main Card */
        .stage-card {
            width: 100%;
            max-width: 660px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 3px solid #fbcfe8;
            border-radius: 26px;
            padding: 16px 16px 22px 16px;
            box-shadow: 0 14px 32px rgba(190, 24, 93, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative SVG Bunting */
        .bunting-svg {
            width: 100%;
            height: 26px;
            display: block;
            margin-bottom: 6px;
        }

        .badge-unit {
            display: inline-block;
            background: linear-gradient(90deg, var(--magenta), var(--sun));
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .header-title {
            font-family: 'Fredoka One', cursive;
            color: #831843;
            font-size: clamp(24px, 6vw, 32px);
            margin: 0 0 8px 0;
            line-height: 1.15;
        }

        /* Mode Switcher */
        .mode-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0 16px 0;
        }

        .tab-btn {
            flex: 1;
            max-width: 240px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: 0.15s;
        }

        .tab-btn.active {
            background: var(--emerald);
            border-color: var(--emerald-dark);
            color: #fff;
            box-shadow: 0 4px 0 var(--emerald-dark);
        }

        /* ================= STUDY MODE ================= */
        .study-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 540px) {
            .study-grid { grid-template-columns: 1fr 1fr; }
        }

        .study-card {
            background: #fff;
            border: 2px solid #d1fae5;
            border-radius: 18px;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a7f3d0;
            transition: 0.15s;
            text-align: center;
        }

        .study-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #a7f3d0; }
        .study-card.playing { border-color: var(--magenta); background: #fdf2f8; }

        .img-16-9 {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .img-16-9 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .study-phrase {
            font-family: 'Fredoka One', cursive;
            font-size: 17px;
            color: #065f46;
            margin-bottom: 2px;
        }

        .study-thai {
            font-size: 13px;
            font-weight: 700;
            color: #be185d;
        }

        /* ================= GAME MODE ================= */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fefce8;
            border: 2px solid #fde047;
            border-radius: 14px;
            padding: 8px 14px;
            margin-bottom: 10px;
            font-family: 'Prompt', sans-serif;
            font-weight: 700;
            font-size: 14px;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--emerald), var(--sun), var(--magenta));
            transition: width 0.35s ease;
        }

        .stage-pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 99px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            background: #fce7f3;
            color: #be185d;
            border: 2px solid #f9a8d4;
        }

        .stage-pill.stage-2 {
            background: #d1fae5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .question-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            border-radius: 16px;
            border: 4px solid #fde68a;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: popIn 0.35s ease;
        }

        .prompt-area {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .prompt-sentence {
            font-family: 'Fredoka One', 'Prompt', sans-serif;
            font-size: clamp(20px, 5vw, 26px);
            color: var(--ink);
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 10px 18px;
            border-radius: 14px;
            width: 100%;
        }

        .blank-slot {
            display: inline-block;
            min-width: 72px;
            border-bottom: 3px solid var(--magenta);
            color: var(--magenta);
            padding: 0 6px;
        }

        .btn-audio {
            background: var(--sun);
            color: #fff;
            border: none;
            padding: 7px 18px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--sun-dark);
            transition: 0.1s;
        }
        .btn-audio:active { transform: translateY(3px); box-shadow: none; }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 520px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }

        .opt-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            padding: 14px 12px;
            font-family: 'Fredoka One', 'Sarabun', sans-serif;
            font-size: clamp(16px, 4vw, 18px);
            color: var(--ink);
            cursor: pointer;
            box-shadow: 0 5px 0 #cbd5e1;
            transition: 0.15s;
        }

        .opt-btn:hover:not(.disabled) {
            border-color: var(--magenta);
            color: var(--magenta-dark);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #f9a8d4;
        }

        .opt-btn:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .opt-btn.disabled { pointer-events: none; }

        .opt-btn.correct-ans {
            background: #22c55e !important;
            border-color: #15803d !important;
            color: #fff !important;
            box-shadow: 0 5px 0 #15803d !important;
        }

        .opt-btn.wrong-ans {
            background: #ef4444 !important;
            border-color: #b91c1c !important;
            color: #fff !important;
            box-shadow: 0 5px 0 #b91c1c !important;
            animation: shake 0.35s;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        /* Action Button */
        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--magenta);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-family: 'Prompt', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--magenta-dark);
            transition: 0.1s;
        }

        .btn-primary:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-primary:disabled {
            background: #94a3b8;
            box-shadow: 0 5px 0 #64748b;
            cursor: not-allowed;
            opacity: 0.75;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            padding: 15px;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: #fff;
            padding: 26px 20px;
            border-radius: 26px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            border: 4px solid var(--magenta);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-box input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 2px solid #fbcfe8;
            border-radius: 14px;
            text-align: center;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        .modal-box input:focus { border-color: var(--magenta); }

        .score-num {
            font-family: 'Fredoka One', cursive;
            font-size: 58px;
            color: var(--magenta);
            margin: 8px 0;
            display: block;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- User Profile Bar -->
    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <!-- Main Stage -->
    <div class="stage-card">
        <!-- SVG Festive Bunting -->
        <svg class="bunting-svg" viewBox="0 0 600 30" preserveAspectRatio="none">
            <path d="M0,4 Q300,22 600,4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
            <polygon points="30,6 55,8 42,26" fill="#ec4899"/>
            <polygon points="95,10 120,12 107,28" fill="#10b981"/>
            <polygon points="165,13 190,14 177,29" fill="#f59e0b"/>
            <polygon points="240,15 265,15 252,30" fill="#3b82f6"/>
            <polygon points="335,15 360,15 347,30" fill="#ec4899"/>
            <polygon points="410,14 435,13 422,29" fill="#10b981"/>
            <polygon points="480,12 505,10 492,28" fill="#f59e0b"/>
            <polygon points="545,8 570,6 557,26" fill="#8b5cf6"/>
        </svg>

        <div class="badge-unit">Unit 8a • Celebrations</div>
        <h1 class="header-title">🎉 Spring Celebrations</h1>

        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button id="tabStudy" class="tab-btn" onclick="switchMode('study')">🎧 ฝึกฟังคำศัพท์</button>
            <button id="tabGame" class="tab-btn active" onclick="switchMode('game')">🏆 เล่นเกม (12 คะแนน)</button>
        </div>

        <!-- STUDY VIEW -->
        <div id="studyView" style="display:none;">
            <p style="margin:0 0 12px 0; font-size:14px; color:#64748b; font-weight:600;">แตะที่การ์ดเพื่อฟังเสียงและฝึกออกเสียงตามก่อนเริ่มเล่นเกม</p>
            <div class="study-grid" id="studyGrid"></div>
            <button class="btn-primary" style="background:var(--emerald); box-shadow:0 5px 0 var(--emerald-dark);" onclick="switchMode('game')">🚀 พร้อมแล้ว! ไปทำภารกิจ 2 ด่าน</button>
        </div>

        <!-- GAME VIEW -->
        <div id="gameView">
            <div class="hud-bar">
                <span id="progressText">ข้อที่ 1 / 12</span>
                <span id="scoreText" style="color:var(--emerald-dark);">⭐ คะแนน: 0</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="stage-pill" id="stagePill">ด่านที่ 1: Festival Snap! (ดูภาพทายวลี)</div>

            <div class="question-frame">
                <img id="qImage" src="" alt="Celebration Scene">
            </div>

            <div class="prompt-area">
                <button id="btnAudioHint" class="btn-audio" onclick="playCurrentAudio()">🔊 ฟังเสียงอีกครั้ง</button>
                <div id="promptSentence" class="prompt-sentence" style="display:none;"></div>
            </div>

            <div class="options-grid" id="optionsContainer"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:#831843; margin:0 0 6px 0; font-family:'Prompt';">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color:#64748b; font-weight:600; margin:0 0 12px 0; font-size:14px;">กรอกข้อมูลเพื่อเริ่มทำกิจกรรมและบันทึกคะแนน</p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-primary" onclick="confirmUser()">🚀 เริ่มเล่นเกม</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:#831843; margin:0; font-family:'Prompt';">🎊 ภารกิจสำเร็จ!</h2>
            <p style="color:#64748b; font-weight:600; margin:6px 0 0 0;">คะแนนรวม 2 ด่านของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:28px; color:#94a3b8;">/12</span></span>
            <div id="saveStatus" style="font-weight:700; font-size:15px; margin-bottom:14px; color:#15803d; min-height:22px;"></div>
            <button id="playAgainBtn" class="btn-primary" onclick="restartGame()" disabled>🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 8 Celebrations vocab';

    // ข้อมูลคำศัพท์ทั้ง 6 วลี ตรงตามชื่อไฟล์ใน GitHub
    const vocabList = [
        { phrase: "paint their faces", verb: "paint", rest: "their faces", thai: "เพ้นท์หน้า / ระบายสีบนใบหน้า", img: "1paint.jpg", audio: "1paint.mp3" },
        { phrase: "wear traditional costumes", verb: "wear", rest: "traditional costumes", thai: "สวมชุดประจำชาติ / ชุดพื้นเมือง", img: "2wear.jpg", audio: "2wear.mp3" },
        { phrase: "play the bagpipes", verb: "play", rest: "the bagpipes", thai: "เป่าปี่สกอต (แบกไปป์)", img: "3play.jpg", audio: "3play.mp3" },
        { phrase: "have a street parade", verb: "have", rest: "a street parade", thai: "จัดขบวนพาเหรดบนถนน", img: "4have.jpg", audio: "4have.mp3" },
        { phrase: "wear knight costumes", verb: "wear", rest: "knight costumes", thai: "สวมชุดอัศวิน", img: "5wearknight.jpg", audio: "5wearknight.mp3" },
        { phrase: "fly the national flag", verb: "fly", rest: "the national flag", thai: "โบกธงชาติ / ประดับธงชาติ", img: "6fly.jpg", audio: "6fly.mp3" }
    ];

    const verbPool = ["paint", "wear", "play", "have", "fly"];
    const MAX_Q = 12; // ด่าน 1 (6 ข้อ) + ด่าน 2 (6 ข้อ)

    let questions = [];
    let currentQ = 0;
    let score = 0;
    let canClick = true;
    let isPendingSubmit = false;
    let wordAudio = new Audio();

    window.onload = () => {
        renderStudyCards();
        checkLoginStatus();
    };

    // ================= WEB AUDIO API SFX =================
    function playSFX(isCorrect) {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();

            const notes = isCorrect
                ? [{ f: 523.25, t: 0, d: 0.12 }, { f: 659.25, t: 0.12, d: 0.12 }, { f: 783.99, t: 0.24, d: 0.22 }]
                : [{ f: 310, t: 0, d: 0.16 }, { f: 210, t: 0.17, d: 0.24 }];

            notes.forEach(n => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = isCorrect ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.t);
                gain.gain.setValueAtTime(0.001, ctx.currentTime + n.t);
                gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + n.t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.t + n.d);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + n.t);
                osc.stop(ctx.currentTime + n.t + n.d);
            });
            setTimeout(() => ctx.close().catch(() => {}), 800);
        } catch (e) {}
    }

    // ================= MODE SWITCHING =================
    function switchMode(mode) {
        document.getElementById('tabStudy').classList.toggle('active', mode === 'study');
        document.getElementById('tabGame').classList.toggle('active', mode === 'game');
        document.getElementById('studyView').style.display = mode === 'study' ? 'block' : 'none';
        document.getElementById('gameView').style.display = mode === 'game' ? 'block' : 'none';
        if (mode === 'game') initGame();
    }

    // ================= STUDY MODE =================
    function renderStudyCards() {
        const grid = document.getElementById('studyGrid');
        grid.innerHTML = '';
        vocabList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'study-card';
            card.innerHTML = `
                <div class="img-16-9"><img src="${item.img}" alt="${item.phrase}"></div>
                <div class="study-phrase">🔊 ${item.phrase}</div>
                <div class="study-thai">${item.thai}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.study-card').forEach(c => c.classList.remove('playing'));
                card.classList.add('playing');
                wordAudio.src = item.audio;
                wordAudio.currentTime = 0;
                wordAudio.play().catch(() => {});
                setTimeout(() => card.classList.remove('playing'), 1200);
            };
            grid.appendChild(card);
        });
    }

    // ================= GAME MODE (2 STAGES) =================
    function initGame() {
        score = 0;
        currentQ = 0;
        document.getElementById('scoreText').innerText = `⭐ คะแนน: 0`;

        // ด่านที่ 1: จับคู่ภาพกับวลี (สุ่ม 6 ข้อ)
        const stage1 = [...vocabList].sort(() => Math.random() - 0.5).map(item => ({
            stage: 1,
            data: item
        }));

        // ด่านที่ 2: เติมคำกริยาช่อง 1 ให้ถูกต้อง (สุ่ม 6 ข้อ)
        const stage2 = [...vocabList].sort(() => Math.random() - 0.5).map(item => ({
            stage: 2,
            data: item
        }));

        questions = [...stage1, ...stage2];
        loadQuestion();
    }

    function playCurrentAudio() {
        const q = questions[currentQ];
        if (!q) return;
        wordAudio.src = q.data.audio;
        wordAudio.currentTime = 0;
        wordAudio.play().catch(() => {});
    }

    function loadQuestion() {
        canClick = true;
        const q = questions[currentQ];
        const item = q.data;

        document.getElementById('progressText').innerText = `ข้อที่ ${currentQ + 1} / ${MAX_Q}`;
        document.getElementById('progressFill').style.width = `${(currentQ / MAX_Q) * 100}%`;

        const pill = document.getElementById('stagePill');
        const audioBtn = document.getElementById('btnAudioHint');
        const sentenceBox = document.getElementById('promptSentence');

        // โหลดรูปภาพพร้อมกันภาพเก่ากระพริบ
        const imgEl = document.getElementById('qImage');
        imgEl.style.visibility = 'hidden';
        imgEl.onload = () => { imgEl.style.visibility = 'visible'; };
        imgEl.src = item.img;
        if (imgEl.complete && imgEl.naturalWidth > 0) imgEl.style.visibility = 'visible';

        let options = [];
        let correctVal = '';

        if (q.stage === 1) {
            pill.innerText = 'ด่านที่ 1/2: Festival Snap! (ดูภาพเลือกวลี)';
            pill.classList.remove('stage-2');
            audioBtn.style.display = 'inline-block';
            sentenceBox.style.display = 'none';

            correctVal = item.phrase;
            const wrong = vocabList.filter(v => v.phrase !== correctVal)
                                   .sort(() => Math.random() - 0.5)
                                   .slice(0, 3)
                                   .map(v => v.phrase);
            options = [correctVal, ...wrong].sort(() => Math.random() - 0.5);

            setTimeout(() => playCurrentAudio(), 250);
        } else {
            pill.innerText = 'ด่านที่ 2/2: Verb Matcher (เลือกกริยาให้ตรงวลี)';
            pill.classList.add('stage-2');
            audioBtn.style.display = 'none';
            sentenceBox.style.display = 'block';
            sentenceBox.innerHTML = `<span class="blank-slot" id="blankSlot">_____</span> ${item.rest}`;

            correctVal = item.verb;
            const wrong = verbPool.filter(v => v !== correctVal)
                                  .sort(() => Math.random() - 0.5)
                                  .slice(0, 3);
            options = [correctVal, ...wrong].sort(() => Math.random() - 0.5);
        }

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optText => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.dataset.val = optText;
            btn.innerText = optText;
            btn.onclick = () => checkAnswer(optText === correctVal, btn, correctVal, q.stage);
            container.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect, selectedBtn, correctVal, stage) {
        if (!canClick) return;
        canClick = false;

        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.classList.add('disabled'));

        playSFX(isCorrect);

        if (stage === 2) {
            const slot = document.getElementById('blankSlot');
            if (slot) slot.innerText = correctVal;
        }

        if (isCorrect) {
            score++;
            document.getElementById('scoreText').innerText = `⭐ คะแนน: ${score}`;
            selectedBtn.classList.add('correct-ans');
            selectedBtn.innerText = '✔️ ' + selectedBtn.innerText;
        } else {
            selectedBtn.classList.add('wrong-ans');
            selectedBtn.innerText = '❌ ' + selectedBtn.innerText;
            allBtns.forEach(b => {
                if (b.dataset.val === correctVal) b.classList.add('correct-ans');
            });
        }

        setTimeout(() => {
            currentQ++;
            if (currentQ < MAX_Q) {
                loadQuestion();
            } else {
                document.getElementById('progressFill').style.width = '100%';
                endGame();
            }
        }, 1250);
    }

    function endGame() {
        if (!localStorage.getItem('studentId')) {
            isPendingSubmit = true;
            document.getElementById('modalTitle').innerText = "👋 จบเกมแล้ว!";
            document.getElementById('modalSub').innerText = `คุณได้ ${score}/${MAX_Q} คะแนน กรอกข้อมูลเพื่อบันทึก`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    // ================= LOGIN & GOOGLE SHEETS =================
    function formatRoomValue(val) {
        const nums = val.match(/\d+/g);
        if (nums && nums.length >= 2) return `ม.${nums[0]}/${nums[1]}`;
        if (nums && nums.length === 1) return `ม.1/${nums[0]}`;
        return val.trim();
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        this.value = formatRoomValue(this.value);
    });

    function checkLoginStatus() {
        if (localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId');
            initGame();
        } else {
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชีผู้เล่น?',
            text: 'ระบบจะล้างข้อมูลเดิมและเริ่มเกมใหม่',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ec4899',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง',
            cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if (res.isConfirmed) {
                localStorage.clear();
                isPendingSubmit = false;
                document.getElementById('userProfile').style.display = 'none';
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                document.getElementById('modalSub').innerText = "กรอกข้อมูลนักเรียนคนใหม่เพื่อเริ่มเล่น";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    function confirmUser() {
        const n = document.getElementById('in_name').value.trim();
        const r = formatRoomValue(document.getElementById('in_room').value);
        document.getElementById('in_room').value = r;
        const id = document.getElementById('in_id').value.trim();

        if (!n || !r || id.length !== 5) {
            Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัสนักเรียน 5 หลัก', 'warning');
            return;
        }

        localStorage.setItem('studentName', n);
        localStorage.setItem('studentRoom', r);
        localStorage.setItem('studentId', id);

        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id;

        if (isPendingSubmit) {
            isPendingSubmit = false;
            submitScore();
        } else {
            initGame();
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // ล็อกปุ่มเล่นใหม่ระหว่างส่งคะแนน
        playAgainBtn.disabled = true;

        if (typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)";
            stat.style.color = "#b91c1c";
            playAgainBtn.disabled = false;
            return;
        }

        stat.innerText = "⏳ กำลังบันทึกคะแนนลงระบบ...";
        stat.style.color = "#d97706";

        const payload = {
            name: localStorage.getItem('studentName'),
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'),
            lesson: TOPIC_NAME,
            score: score,
            maxScore: MAX_Q
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        }).catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!";
            stat.style.color = "#15803d";
            playAgainBtn.disabled = false;
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }
</script>
</body>
</html>
