<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spring Celebrations - Reading (T/F)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Prompt:wght@500;700&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --emerald: #10b981;
            --emerald-dark: #059669;
            --magenta: #ec4899;
            --magenta-dark: #be185d;
            --amber: #f59e0b;
            --amber-dark: #d97706;
            --ink: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 12px 12px 40px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink);
            background: linear-gradient(160deg, #ecfdf5 0%, #fefce8 50%, #fdf2f8 100%);
        }

        /* Profile Bar */
        .profile-bar {
            width: 100%;
            max-width: 760px;
            font-size: clamp(12px, 3.2vw, 14px);
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid #a7f3d0;
            padding: 8px 14px;
            border-radius: 20px;
            color: #065f46;
            font-weight: 700;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
        }

        .btn-switch {
            background: var(--magenta);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 700;
            font-size: 12px;
        }

        /* Main Card */
        .card {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.96);
            border: 3px solid #fbcfe8;
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 12px 28px rgba(190, 24, 93, 0.09);
            margin-bottom: 16px;
        }

        .header-center { text-align: center; margin-bottom: 12px; }

        .badge-unit {
            display: inline-block;
            background: linear-gradient(90deg, var(--magenta), var(--amber));
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #831843;
            font-size: clamp(24px, 6vw, 34px);
            margin: 0;
        }

        /* Tabs (Intro + 3 Festivals) */
        .fest-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        @media (min-width: 600px) {
            .fest-tabs { grid-template-columns: repeat(4, 1fr); }
        }

        .fest-tab {
            padding: 9px 8px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .fest-tab.active {
            background: var(--emerald);
            border-color: var(--emerald-dark);
            color: #fff;
            box-shadow: 0 4px 0 var(--emerald-dark);
        }

        /* Media Stage (16:9 + Overlay Subtitles + Fullscreen) */
        .media-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            border-radius: 16px;
            border: 3px solid #fde68a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.15);
        }

        .media-stage img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Pseudo-fullscreen fallback for mobile */
        .media-stage.pseudo-fs {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto !important;
            border: none !important;
            border-radius: 0 !important;
            z-index: 4000 !important;
        }

        .media-stage:fullscreen { border: none; border-radius: 0; }

        .btn-exit-fs {
            display: none;
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 6px 14px;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .media-stage:fullscreen .btn-exit-fs,
        .media-stage.pseudo-fs .btn-exit-fs {
            display: block;
        }
        .btn-fs-play {
            display: none;
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
            background: rgba(16, 185, 129, 0.92);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .media-stage:fullscreen .btn-fs-play,
        .media-stage.pseudo-fs .btn-fs-play {
            display: block;
        }

        /* Overlay Subtitle on Image Stage */
        .sub-overlay {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 94%;
            text-align: center;
            pointer-events: none;
            z-index: 15;
        }

        .sub-overlay.hidden { display: none; }

        .sub-box {
            display: inline-block;
            background: rgba(15, 23, 42, 0.84);
            color: #f8fafc;
            font-family: 'Prompt', sans-serif;
            font-size: clamp(13px, 3vw, 19px);
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 12px;
            line-height: 1.45;
            text-shadow: 0 1px 2px #000;
        }

        .sub-box:empty { display: none; }

        .media-stage:fullscreen .sub-box,
        .media-stage.pseudo-fs .sub-box {
            font-size: clamp(18px, 3.2vw, 28px);
            padding: 10px 18px;
        }

        .sub-word {
            display: inline-block;
            padding: 0 3px;
            margin: 0 1px;
            border-radius: 5px;
            transition: background-color 0.08s, color 0.08s;
        }

        .sub-word.active {
            background-color: #fde047;
            color: #1e293b;
            font-weight: 700;
            text-shadow: none;
        }

        .sub-word.is-vocab {
            pointer-events: auto;
            cursor: pointer;
            border-bottom: 2px dashed #f472b6;
            color: #fbcfe8;
        }

        .sub-word.is-vocab.active {
            color: #9d174d;
        }

        /* Stage Controls & Thumbnails */
        .thumb-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .thumb-btn {
            width: 72px;
            aspect-ratio: 16 / 9;
            padding: 0;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.15s;
        }
        .thumb-btn.active { border-color: var(--magenta); opacity: 1; transform: scale(1.06); }
        .thumb-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .stage-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 14px;
            padding: 8px 10px;
        }

        .stage-toolbar audio {
            flex: 1;
            min-width: 190px;
            height: 36px;
        }

        .btn-tool {
            background: var(--ink);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-tool.off { background: #94a3b8; }
        .btn-tool.fs { background: var(--amber-dark); }

        /* Full Synced Passage Box */
        .passage-box {
            margin-top: 12px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: clamp(15px, 3.8vw, 18px);
            line-height: 1.85;
            color: #1e293b;
        }

        .p-word {
            display: inline-block;
            padding: 0 2px;
            border-radius: 5px;
            transition: background-color 0.08s;
        }
        .p-word.active {
            background-color: #fef08a;
            color: #831843;
            font-weight: 800;
        }
        .p-word.is-vocab {
            color: #be185d;
            font-weight: 800;
            border-bottom: 2px dashed #f472b6;
            cursor: pointer;
        }

        .speaker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
        }

        .speaker-tag {
            background: #fef3c7;
            color: #92400e;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 10px;
        }

        .vocab-hint { font-size: 12px; color: #be185d; font-weight: 700; }

        /* Vocab Popover */
        #vocab-popover {
            display: none;
            position: fixed;
            background: #fff;
            border: 2px solid var(--magenta);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
            padding: 10px 14px;
            border-radius: 14px;
            text-align: center;
            z-index: 5000;
            min-width: 170px;
            max-width: 240px;
        }
        .pop-eng { font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 700; color: #831843; }
        .pop-pos { display: inline-block; font-size: 11px; font-weight: 700; background: #fce7f3; color: #be185d; padding: 1px 8px; border-radius: 8px; margin: 3px 0; }
        .pop-thai { font-size: 15px; font-weight: 800; color: #059669; margin-top: 2px; }

        /* Quiz Section */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #fbcfe8;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .quiz-title { font-family: 'Prompt', sans-serif; font-size: 18px; font-weight: 700; color: #831843; margin: 0; }
        .quiz-badge { background: #dcfce7; color: #15803d; font-weight: 800; padding: 4px 12px; border-radius: 12px; font-size: 13px; border: 2px solid #86efac; }

        .q-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .q-text { font-family: 'Prompt', sans-serif; font-size: clamp(15px, 4vw, 17px); font-weight: 700; margin: 0 0 10px 0; }

        .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tf-btn {
            padding: 11px 10px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            font-family: 'Fredoka One', 'Prompt', sans-serif;
            font-size: 16px;
            color: #334155;
            cursor: pointer;
            box-shadow: 0 4px 0 #cbd5e1;
            transition: 0.15s;
        }
        .tf-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .tf-btn.selected { border-color: var(--amber-dark); background: #fef3c7; color: #92400e; box-shadow: 0 4px 0 var(--amber-dark); }
        .tf-btn.correct { border-color: var(--success); background: #dcfce7; color: #14532d; box-shadow: 0 4px 0 var(--success); }
        .tf-btn.wrong { border-color: var(--danger); background: #fee2e2; color: #7f1d1d; box-shadow: 0 4px 0 var(--danger); }

        .correction-note {
            display: none;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: #fffbeb;
            border-left: 4px solid var(--amber);
            font-size: 14px;
            font-weight: 600;
            color: #78350f;
        }

        .btn-primary {
            width: 100%;
            max-width: 380px;
            margin: 14px auto 0 auto;
            display: block;
            padding: 13px 18px;
            background: var(--magenta);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-family: 'Prompt', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--magenta-dark);
            transition: 0.1s;
        }
        .btn-primary:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-primary:disabled { background: #94a3b8; box-shadow: 0 5px 0 #64748b; cursor: not-allowed; opacity: 0.75; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 6000;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            padding: 15px;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff;
            padding: 26px 20px;
            border-radius: 26px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            border: 4px solid var(--magenta);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .modal-box input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 2px solid #fbcfe8;
            border-radius: 14px;
            text-align: center;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }
        .score-num { font-family: 'Fredoka One', cursive; font-size: 58px; color: var(--magenta); margin: 8px 0; display: block; line-height: 1; }
    </style>
</head>
<body>

    <!-- User Profile Bar -->
    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <!-- Reading + Synced Subtitle Card -->
    <div class="card">
        <div class="header-center">
            <div class="badge-unit">Unit 8a • Reading (Listen & Read)</div>
            <h1>🌸 Spring Celebrations</h1>
        </div>

        <!-- 4 Tabs -->
        <div class="fest-tabs">
            <button class="fest-tab active" onclick="selectTrack('intro', this)">✨ Intro</button>
            <button class="fest-tab" onclick="selectTrack('hugh', this)">🐉 1. St David's</button>
            <button class="fest-tab" onclick="selectTrack('james', this)">☘️ 2. St Patrick's</button>
            <button class="fest-tab" onclick="selectTrack('sam', this)">⚔️ 3. St George's</button>
        </div>

        <!-- Image Stage with Overlay Subtitles -->
        <div class="media-stage" id="mediaStage">
            <button class="btn-exit-fs" onclick="exitFullscreenMode()">✕ Exit (Esc)</button>
            <button id="btnFsPlay" class="btn-fs-play" onclick="toggleFsPlay()">▶ Play</button>
            <img id="stageImage" src="4have.jpg" alt="Festival Scene">
            <div id="subOverlay" class="sub-overlay">
                <div id="subBox" class="sub-box"></div>
            </div>
        </div>

        <!-- Thumbnail Switcher -->
        <div class="thumb-strip" id="thumbStrip"></div>

        <!-- Audio + CC + Fullscreen Toolbar -->
        <div class="stage-toolbar">
            <audio id="mainAudio" controls preload="metadata" src="intro.mp3"></audio>
            <button id="btnCC" class="btn-tool" onclick="toggleCC()">CC: ON</button>
            <button class="btn-tool fs" onclick="toggleFullscreenMode()">⛶ Fullscreen</button>
        </div>

        <!-- Synced Full Passage -->
        <div class="passage-box">
            <div id="passageWords"></div>
            <div class="speaker-row">
                <span class="speaker-tag" id="speakerTag">🎙️ Intro: Spring Celebrations</span>
                <span class="vocab-hint">💡 แตะคำสีชมพูเส้นประเพื่อดูคำแปล</span>
            </div>
        </div>
    </div>

    <!-- True / False Quiz Card -->
    <div class="card" id="quizSection">
        <div class="quiz-header">
            <h2 class="quiz-title">📝 Mark T (True) or F (False)</h2>
            <span class="quiz-badge">4 คะแนน</span>
        </div>
        <div id="quizContainer"></div>
        <button id="btnCheckQuiz" class="btn-primary" onclick="checkAndSubmitQuiz()">✅ ตรวจคำตอบและส่งคะแนน</button>
    </div>

    <!-- Vocabulary Popover -->
    <div id="vocab-popover">
        <div class="pop-eng" id="pop-eng"></div>
        <div class="pop-pos" id="pop-pos"></div>
        <div class="pop-thai" id="pop-thai"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:#831843; margin:0 0 6px 0; font-family:'Prompt';">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color:#64748b; font-weight:600; margin:0 0 12px 0; font-size:14px;">กรอกข้อมูลเพื่อบันทึกคะแนน</p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-primary" style="margin-top:4px;" onclick="confirmUser()">🚀 ยืนยันข้อมูล</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:#831843; margin:0; font-family:'Prompt';">🎉 สรุปผลคะแนน</h2>
            <p style="color:#64748b; font-weight:600; margin:6px 0 0 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:28px; color:#94a3b8;">/4</span></span>
            <div id="saveStatus" style="font-weight:700; font-size:15px; margin-bottom:14px; color:#15803d; min-height:22px;"></div>
            <button class="btn-primary" style="background:var(--emerald); box-shadow:0 5px 0 var(--emerald-dark); margin-top:0;" onclick="closeScoreModal()">👀 ดูเฉลยและคำแก้ไข</button>
            <button id="playAgainBtn" class="btn-primary" style="margin-top:10px;" onclick="resetQuiz()" disabled>🔄 ทำแบบทดสอบอีกครั้ง</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 8 Celebrations Reading T or F';

    // พจนานุกรมคำศัพท์ 34 คำ/วลี ตามหนังสือเรียน
    const dictionary = {
        "forget": { label: "forget", pos: "v.", thai: "ลืม" },
        "served": { label: "serve (served)", pos: "v.", thai: "เสิร์ฟ, ให้บริการอาหาร" },
        "bacon": { label: "bacon", pos: "n.", thai: "เบคอน" },
        "bagpipes": { label: "bagpipes", pos: "n.", thai: "ปี่สกอต (แบกไปป์)" },
        "celebrations": { label: "celebration", pos: "n.", thai: "การเฉลิมฉลอง, งานฉลอง" },
        "costumes": { label: "costume", pos: "n.", thai: "ชุดแต่งกาย, ชุดประจำชาติ" },
        "covent": { label: "Covent Garden", pos: "n.", thai: "โคเวนต์การ์เดน (ย่านท่องเที่ยวในลอนดอน)" },
        "garden": { label: "Covent Garden", pos: "n.", thai: "โคเวนต์การ์เดน (ย่านท่องเที่ยวในลอนดอน)" },
        "date": { label: "Make it a date in your diary.", pos: "phr.", thai: "จดวันนัดลงในไดอารีไว้เลย (ห้ามพลาด)" },
        "diary": { label: "diary", pos: "n.", thai: "สมุดบันทึก, ไดอารี" },
        "dinner": { label: "dinner", pos: "n.", thai: "อาหารมื้อเย็น" },
        "dublin": { label: "Dublin", pos: "n.", thai: "ดับลิน (เมืองหลวงของไอร์แลนด์)" },
        "lamb": { label: "lamb", pos: "n.", thai: "เนื้อแกะ" },
        "schoolmates": { label: "schoolmate", pos: "n.", thai: "เพื่อนร่วมโรงเรียน" },
        "soda": { label: "soda bread", pos: "n.", thai: "ขนมปังโซดา (ขนมปังพื้นเมืองไอร์แลนด์)" },

    // ================= TRACK & SUBTITLE ENGINE =================
    function selectTrack(key, btnEl) {
        document.querySelectorAll('.fest-tab').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        loadTrack(key);
    }

    function loadTrack(key) {
        activeTrackKey = key;
        const t = tracks[key];
        audio.pause();
        audio.src = t.audio;
        audio.currentTime = 0;
        curSegIdx = -1;
        curWordIdx = -1;
        activeFlatIdx = -1;
        subBox.innerHTML = '';

        document.getElementById('speakerTag').innerText = t.speaker;
        document.getElementById('stageImage').src = t.images[0];

        // Render thumbnails
        const strip = document.getElementById('thumbStrip');
        strip.innerHTML = '';
        if (t.images.length > 1) {
            t.images.forEach((imgSrc, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'thumb-btn' + (i === 0 ? ' active' : '');
                b.innerHTML = `<img src="${imgSrc}" alt="Scene ${i + 1}">`;
                b.onclick = () => {
                    document.getElementById('stageImage').src = imgSrc;
                    strip.querySelectorAll('.thumb-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                strip.appendChild(b);
            });
        }

        // Render full passage with clickable vocab
        const pWrap = document.getElementById('passageWords');
        pWrap.innerHTML = '';
        flatWords = [];
        let fIdx = 0;

        t.segments.forEach(seg => {
            seg.w.forEach(item => {
                const span = document.createElement('span');
                span.className = 'p-word';
                span.id = `pw-${fIdx}`;
                span.innerText = item[0];

                const clean = item[0].replace(/[^a-zA-Z]/g, '').toLowerCase();
                if (dictionary[clean]) {
                    span.classList.add('is-vocab');
                    span.onclick = (e) => showPopover(e, clean);
                }

                pWrap.appendChild(span);
                pWrap.appendChild(document.createTextNode(' '));
                flatWords.push({ s: item[1], e: item[2], id: fIdx });
                fIdx++;
            });
        });
    }

    function syncSubtitle() {
        const time = audio.currentTime;
        const t = tracks[activeTrackKey];

        // 1. Sync Overlay Subtitle
        if (ccEnabled) {
            const segIdx = t.segments.findIndex(seg => time >= seg.s && time <= seg.e + 0.35);
            if (segIdx !== curSegIdx) {
                curSegIdx = segIdx;
                curWordIdx = -1;
                subBox.innerHTML = '';

                if (segIdx !== -1) {
                    t.segments[segIdx].w.forEach((item, wIdx) => {
                        const span = document.createElement('span');
                        span.className = 'sub-word';
                        span.id = `sw-${wIdx}`;
                        span.innerText = item[0];

                        const clean = item[0].replace(/[^a-zA-Z]/g, '').toLowerCase();
                        if (dictionary[clean]) {
                            span.classList.add('is-vocab');
                            span.onclick = (e) => showPopover(e, clean);
                        }
                        subBox.appendChild(span);
                    });
                }
            }

            if (segIdx !== -1) {
                const words = t.segments[segIdx].w;
                const wIdx = words.findIndex((item, i) => {
                    const next = words[i + 1];
                    const endT = next ? next[1] : item[2] + 0.35;
                    return time >= item[1] && time < endT;
                });

                if (wIdx !== curWordIdx) {
                    if (curWordIdx !== -1) {
                        const oldW = document.getElementById(`sw-${curWordIdx}`);
                        if (oldW) oldW.classList.remove('active');
                    }
                    if (wIdx !== -1) {
                        const newW = document.getElementById(`sw-${wIdx}`);
                        if (newW) newW.classList.add('active');
                    }
                    curWordIdx = wIdx;
                }
            }
        }

        // 2. Sync Full Passage Highlight
        const fIdx = flatWords.findIndex((item, i) => {
            const next = flatWords[i + 1];
            const endT = next ? next.s : item.e + 0.35;
            return time >= item.s && time < endT;
        });

        if (fIdx !== activeFlatIdx) {
            if (activeFlatIdx !== -1) {
                const oldP = document.getElementById(`pw-${activeFlatIdx}`);
                if (oldP) oldP.classList.remove('active');
            }
            if (fIdx !== -1) {
                const newP = document.getElementById(`pw-${fIdx}`);
                if (newP) newP.classList.add('active');
            }
            activeFlatIdx = fIdx;
        }

        if (!audio.paused && !audio.ended) {
            requestAnimationFrame(syncSubtitle);
        }
    }

    audio.addEventListener('play', () => requestAnimationFrame(syncSubtitle));
    audio.addEventListener('seeked', () => syncSubtitle());
    audio.addEventListener('ended', () => {
        curSegIdx = -1; curWordIdx = -1; subBox.innerHTML = '';
        if (activeFlatIdx !== -1) {
            const oldP = document.getElementById(`pw-${activeFlatIdx}`);
            if (oldP) oldP.classList.remove('active');
            activeFlatIdx = -1;
        }
    });

    function toggleFullscreenMode() {
        if (document.fullscreenElement || document.webkitFullscreenElement || stage.classList.contains('pseudo-fs')) {
            exitFullscreenMode();
        } else {
            if (stage.requestFullscreen) {
                stage.requestFullscreen().catch(() => stage.classList.add('pseudo-fs'));
            } else if (stage.webkitRequestFullscreen) {
                stage.webkitRequestFullscreen();
            } else {
                stage.classList.add('pseudo-fs');
            }
        }
    }

    function exitFullscreenMode() {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
        stage.classList.remove('pseudo-fs');
    }

    document.addEventListener('keydown', (e) => {

            exitFullscreenMode();
        }
    });

    // ================= FULLSCREEN-SAFE VOCAB POPOVER =================
    function showPopover(event, wordKey) {
        event.stopPropagation();
        audio.pause();

        const container = document.fullscreenElement || document.webkitFullscreenElement || document.body;
        if (popover.parentNode !== container) container.appendChild(popover);

        const data = dictionary[wordKey];
        if (!data) return;

        document.getElementById('pop-eng').innerText = data.label;
        document.getElementById('pop-pos').innerText = data.pos;
        document.getElementById('pop-thai').innerText = data.thai;

        popover.style.position = 'fixed';
        popover.style.display = 'block';

        const popW = popover.offsetWidth;
        const popH = popover.offsetHeight;
        let leftPos = event.clientX - (popW / 2);
        let topPos = event.clientY - popH - 16;

        if (leftPos < 10) leftPos = 10;
        if (leftPos + popW > window.innerWidth - 10) leftPos = window.innerWidth - popW - 10;
        if (topPos < 10) topPos = event.clientY + 18;

        popover.style.left = leftPos + 'px';
        popover.style.top = topPos + 'px';
    }

    document.addEventListener('click', () => { popover.style.display = 'none'; });

        if (isQuizGraded) return;
        userAnswers[idx] = val;
        document.getElementById(`q-${idx}-T`).classList.toggle('selected', val === 'T');
        document.getElementById(`q-${idx}-F`).classList.toggle('selected', val === 'F');
    }

    function checkAndSubmitQuiz() {
        if (Object.keys(userAnswers).length < quizData.length) {
            Swal.fire({ icon: 'warning', title: 'ยังตอบไม่ครบ!', text: 'กรุณาเลือก T หรือ F ให้ครบทั้ง 4 ข้อก่อนส่งนะครับ', confirmButtonColor: '#ec4899' });
            return;
        }

        isQuizGraded = true;
        let score = 0;

        quizData.forEach((item, idx) => {
            const chosen = userAnswers[idx];
            const btnT = document.getElementById(`q-${idx}-T`);
            const btnF = document.getElementById(`q-${idx}-F`);
            btnT.disabled = true; btnF.disabled = true;
            btnT.classList.remove('selected'); btnF.classList.remove('selected');

            document.getElementById(`q-${idx}-${item.answer}`).classList.add('correct');
            if (chosen === item.answer) score++;
            else document.getElementById(`q-${idx}-${chosen}`).classList.add('wrong');

            document.getElementById(`corr-${idx}`).style.display = 'block';
        });

        latestScore = score;

        const btnCheck = document.getElementById('btnCheckQuiz');
        btnCheck.innerText = '🔄 ทำแบบทดสอบอีกครั้ง';
        btnCheck.style.background = '#10b981';
        btnCheck.style.boxShadow = '0 5px 0 #059669';
        btnCheck.onclick = resetQuiz;

        if (!localStorage.getItem('studentId')) {
            isPendingSubmit = true;
            document.getElementById('modalTitle').innerText = '📝 ลงชื่อเพื่อบันทึกคะแนน';
            document.getElementById('modalSub').innerText = `คุณได้ ${latestScore}/4 คะแนน กรอกข้อมูลเพื่อส่งครู`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScoreToSheet();
        }
    }

    // ================= LOGIN & GOOGLE SHEETS =================
    function formatRoomValue(val) {
        const nums = val.match(/\d+/g);
        if (nums && nums.length >= 2) return `ม.${nums[0]}/${nums[1]}`;
        if (nums && nums.length === 1) return `ม.1/${nums[0]}`;
        return val.trim();
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        this.value = formatRoomValue(this.value);
    });

    function loadStudentProfile() {
        if (localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId');
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชีนักเรียน?', text: 'ระบบจะล้างข้อมูลเดิมเพื่อลงชื่อคนใหม่', icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ec4899', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if (res.isConfirmed) {
                localStorage.clear();
                isPendingSubmit = false;
                document.getElementById('userProfile').style.display = 'none';
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = '🔄 ลงชื่อบัญชีใหม่';
                document.getElementById('modalSub').innerText = 'กรอกข้อมูลนักเรียนคนใหม่';
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    function confirmUser() {
        const n = document.getElementById('in_name').value.trim();
        const r = formatRoomValue(document.getElementById('in_room').value);
        document.getElementById('in_room').value = r;
        const id = document.getElementById('in_id').value.trim();

        if (!n || !r || id.length !== 5) {
            Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัสนักเรียน 5 หลัก', 'warning');
            return;
        }

        localStorage.setItem('studentName', n);
        localStorage.setItem('studentRoom', r);
        localStorage.setItem('studentId', id);
        document.getElementById('loginModal').classList.remove('active');
        loadStudentProfile();

        if (isPendingSubmit) { isPendingSubmit = false; submitScoreToSheet(); }
    }

    function submitScoreToSheet() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = latestScore;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        playAgainBtn.disabled = true;

        if (typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = '❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)';
            stat.style.color = '#b91c1c';
            playAgainBtn.disabled = false;
            return;
        }

        stat.innerText = '⏳ กำลังบันทึกคะแนนลงระบบ...';
        stat.style.color = '#d97706';

        fetch(QUIZ_CONFIG.SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                name: localStorage.getItem('studentName'),
                room: localStorage.getItem('studentRoom'),
                studentId: "'" + localStorage.getItem('studentId'),
                lesson: TOPIC_NAME,
                score: latestScore,
                maxScore: quizData.length
            })
        }).catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = '✅ บันทึกคะแนนลงระบบเรียบร้อย!';
            stat.style.color = '#15803d';
            playAgainBtn.disabled = false;
        }, 1500);
    }

    function closeScoreModal() { document.getElementById('scoreModal').classList.remove('active'); }
    function resetQuiz() {
        document.getElementById('scoreModal').classList.remove('active');
        renderQuiz();
        document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
