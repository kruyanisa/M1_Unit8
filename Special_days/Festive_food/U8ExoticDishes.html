<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exotic Dishes Quiz - Unit 8b</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --coral: #f97316;
            --coral-dark: #c2410c;
            --rose: #f43f5e;
            --rose-dark: #be123c;
            --mint: #10b981;
            --mint-dark: #059669;
            --ink: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 12px 12px 36px 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink);
            background: linear-gradient(160deg, #fff7ed 0%, #fefce8 50%, #fdf2f8 100%);
        }

        /* Profile Bar */
        .profile-bar {
            width: 100%;
            max-width: 720px;
            font-size: clamp(12px, 3.2vw, 14px);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #fed7aa;
            padding: 8px 14px;
            border-radius: 20px;
            color: #9a3412;
            font-weight: 700;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.1);
        }

        .btn-switch {
            background: var(--rose);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 700;
            font-size: 12px;
        }

        /* Main Card */
        .card-shell {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.96);
            border: 3px solid #fed7aa;
            border-radius: 26px;
            padding: 18px;
            box-shadow: 0 12px 28px rgba(249, 115, 22, 0.12);
        }

        .header-top { text-align: center; margin-bottom: 12px; }

        .badge-unit {
            display: inline-block;
            background: linear-gradient(90deg, var(--coral), var(--rose));
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #9a3412;
            font-size: clamp(22px, 5.5vw, 30px);
            margin: 0 0 4px 0;
        }

        .sub-note {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin: 0;
        }

        /* Progress Bar */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 14px 0;
        }

        .progress-track {
            flex: 1;
            height: 12px;
            background: #ffedd5;
            border-radius: 999px;
            overflow: hidden;
            border: 1.5px solid #fed7aa;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--coral), var(--rose));
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .progress-txt {
            font-family: 'Prompt', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: #9a3412;
            min-width: 58px;
            text-align: right;
        }

        /* Dish Image */
        .img-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f172a;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid #fed7aa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .img-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Feedback Banner */
        .feedback-bar {
            min-height: 28px;
            text-align: center;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            border-radius: 12px;
            padding: 4px 10px;
            transition: 0.2s;
        }
        .feedback-bar.ok { background: #dcfce7; color: #166534; }
        .feedback-bar.no { background: #fee2e2; color: #991b1b; }

        /* 5 Choices Grid */
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        @media (max-width: 520px) {
            .choices-grid { grid-template-columns: 1fr; }
        }

        .choice-btn {
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
            background: #fff7ed;
            border: 2.5px solid #fed7aa;
            border-radius: 16px;
            padding: 12px 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 3px 0 #fed7aa;
            transition: 0.12s;
        }

        .choice-btn:hover:not(:disabled) { background: #ffedd5; }

        .choice-btn.selected {
            background: #ffedd5;
            border-color: var(--coral);
            color: #9a3412;
            box-shadow: 0 3px 0 var(--coral);
            transform: translateY(-1px);
        }

        .choice-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--mint) !important;
            color: #166534 !important;
            box-shadow: 0 3px 0 var(--mint-dark) !important;
        }

        .choice-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
            box-shadow: 0 3px 0 #b91c1c !important;
        }

        .choice-btn:disabled { cursor: not-allowed; }

        .choice-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #fdba74;
            color: #9a3412;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .choice-btn.selected .choice-badge {
            background: var(--coral);
            border-color: var(--coral);
            color: #fff;
        }

        /* Action Button */
        .action-row { display: flex; justify-content: center; }

        .btn-primary {
            width: 100%;
            max-width: 300px;
            padding: 13px 24px;
            background: var(--coral);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--coral-dark);
            transition: 0.1s;
        }
        .btn-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-primary:disabled {
            background: #94a3b8;
            box-shadow: 0 4px 0 #64748b;
            cursor: not-allowed;
            opacity: 0.75;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            padding: 15px;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff;
            padding: 26px 20px;
            border-radius: 26px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            border: 4px solid var(--coral);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .modal-box input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 2px solid #fed7aa;
            border-radius: 14px;
            text-align: center;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }
        .score-num {
            font-family: 'Fredoka One', cursive;
            font-size: 56px;
            color: var(--coral);
            margin: 8px 0;
            display: block;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- User Profile Bar -->
    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <!-- Main Quiz Card -->
    <div class="card-shell">
        <div class="header-top">
            <div class="badge-unit">Unit 8b • Festive Food</div>
            <h1>🍽️ Exotic Dishes Quiz</h1>
            <p class="sub-note">ดูภาพแล้วเลือกชื่อเมนูอาหารให้ถูกต้อง แล้วกดปุ่ม Next</p>
        </div>

        <div class="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-txt" id="progressTxt">ข้อ 1 / 5</span>
        </div>

        <div class="img-frame">
            <img id="dishImg" src="" alt="Exotic Dish">
        </div>

        <div id="feedbackBar" class="feedback-bar"></div>

        <div class="choices-grid" id="choicesGrid"></div>

        <div class="action-row">
            <button id="nextBtn" class="btn-primary" onclick="checkAndNext()" disabled>Next ➡️</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:#9a3412; margin:0 0 6px 0; font-family:'Prompt';">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color:#64748b; font-weight:600; margin:0 0 12px 0; font-size:14px;">กรอกข้อมูลเพื่อเริ่มทำแบบฝึกหัดและบันทึกคะแนน</p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-primary" style="width:100%;" onclick="confirmUser()">🚀 เริ่มทำเลย</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:#9a3412; margin:0; font-family:'Prompt';">🎉 สรุปผลคะแนน</h2>
            <p style="color:#64748b; font-weight:600; margin:6px 0 0 0;">คุณทายชื่ออาหารได้</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:26px; color:#94a3b8;">/5</span></span>
            <div id="saveStatus" style="font-weight:700; font-size:14px; margin-bottom:14px; color:#15803d; min-height:20px;"></div>
            <button id="playAgainBtn" class="btn-primary" style="width:100%; background:var(--mint); box-shadow:0 4px 0 var(--mint-dark);" onclick="startQuiz()" disabled>🔄 Play Again</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 8 Festive food Exotic Dishes';

    const baseQuestions = [
        { img: 'roastturkey.jpg',  answer: 'roast turkey',          country: 'USA' },
        { img: 'meatsausages.jpg', answer: 'meat & sausages',       country: 'Iceland' },
        { img: 'roastgoose.jpg',   answer: 'roast goose',           country: 'Germany' },
        { img: 'chickenLamb.jpg',  answer: 'chicken, lamb or beef', country: 'Indonesia' },
        { img: 'sushi.jpg',        answer: 'sushi',                 country: 'Japan' }
    ];

    const allOptions = [
        'roast turkey',
        'meat & sausages',
        'roast goose',
        'chicken, lamb or beef',
        'sushi'
    ];

    const letters = ['A', 'B', 'C', 'D', 'E'];

    let questions = [];
    let currentIdx = 0;
    let selectedOpt = null;
    let score = 0;
    let isLocked = false;
    let isPendingSubmit = false;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function playSfx(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(170, ctx.currentTime + 0.12);
            }
            gain.gain.setValueAtTime(0.14, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkLoginStatus();
        startQuiz();
    });

    function startQuiz() {
        document.getElementById('scoreModal').classList.remove('active');
        questions = shuffle(baseQuestions);
        currentIdx = 0;
        score = 0;
        renderQuestion();
    }

    function renderQuestion() {
        isLocked = false;
        selectedOpt = null;
        const q = questions[currentIdx];

        document.getElementById('progressTxt').innerText = `ข้อ ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('progressFill').style.width = `${((currentIdx) / questions.length) * 100}%`;
        document.getElementById('dishImg').src = q.img;

        const fb = document.getElementById('feedbackBar');
        fb.className = 'feedback-bar';
        fb.innerText = '';

        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        nextBtn.innerText = currentIdx === questions.length - 1 ? '✅ ตรวจ & ส่งคะแนน' : 'Next ➡️';

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        const opts = shuffle(allOptions);

        opts.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.dataset.val = opt;
            btn.innerHTML = `<span class="choice-badge">${letters[i]}</span><span>${opt}</span>`;
            btn.onclick = () => selectChoice(btn, opt);
            grid.appendChild(btn);
        });
    }

    function selectChoice(btn, val) {
        if (isLocked) return;
        selectedOpt = val;
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('nextBtn').disabled = false;
    }

    function checkAndNext() {
        if (isLocked || !selectedOpt) return;
        isLocked = true;
        document.getElementById('nextBtn').disabled = true;

        const q = questions[currentIdx];
        const isCorrect = selectedOpt === q.answer;
        const fb = document.getElementById('feedbackBar');

        document.querySelectorAll('.choice-btn').forEach(b => {
            b.disabled = true;
            if (b.dataset.val === q.answer) {
                b.classList.add('correct');
            } else if (b.dataset.val === selectedOpt && !isCorrect) {
                b.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score++;
            playSfx('correct');
            fb.className = 'feedback-bar ok';
            fb.innerText = `✅ ถูกต้อง! ${q.answer} (${q.country})`;
        } else {
            playSfx('wrong');
            fb.className = 'feedback-bar no';
            fb.innerText = `❌ ยังไม่ถูก! เฉลย: ${q.answer} (${q.country})`;
        }

        document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;

        setTimeout(() => {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }, 1100);
    }

    function finishQuiz() {
        if (!localStorage.getItem('studentId')) {
            isPendingSubmit = true;
            document.getElementById('modalTitle').innerText = '📝 ลงชื่อเพื่อบันทึกคะแนน';
            document.getElementById('modalSub').innerText = `คุณได้ ${score}/5 คะแนน กรอกข้อมูลเพื่อส่งครู`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScoreToSheet(score);
        }
    }

    // ================= LOGIN & GOOGLE SHEETS =================
    function formatRoomValue(val) {
        const nums = val.match(/\d+/g);
        if (nums && nums.length >= 2) return `ม.${nums[0]}/${nums[1]}`;
        if (nums && nums.length === 1) return `ม.1/${nums[0]}`;
        return val.trim();
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        this.value = formatRoomValue(this.value);
    });

    function checkLoginStatus() {
        if (localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId');
        } else {
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชีผู้เล่น?',
            text: 'ระบบจะล้างข้อมูลเดิมและเริ่มใหม่',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#f43f5e',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง',
            cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if (res.isConfirmed) {
                localStorage.clear();
                isPendingSubmit = false;
                document.getElementById('userProfile').style.display = 'none';
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = '🔄 ลงชื่อบัญชีใหม่';
                document.getElementById('modalSub').innerText = 'กรอกข้อมูลนักเรียนคนใหม่เพื่อเริ่มเรียน';
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    function confirmUser() {
        const n = document.getElementById('in_name').value.trim();
        const r = formatRoomValue(document.getElementById('in_room').value);
        document.getElementById('in_room').value = r;
        const id = document.getElementById('in_id').value.trim();

        if (!n || !r || id.length !== 5) {
            Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัสนักเรียน 5 หลัก', 'warning');
            return;
        }

        localStorage.setItem('studentName', n);
        localStorage.setItem('studentRoom', r);
        localStorage.setItem('studentId', id);

        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id;

        if (isPendingSubmit) {
            isPendingSubmit = false;
            submitScoreToSheet(score);
        }
    }

    function submitScoreToSheet(finalScore) {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = finalScore;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        playAgainBtn.disabled = true;

        if (typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = '❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)';
            stat.style.color = '#b91c1c';
            playAgainBtn.disabled = false;
            return;
        }

        stat.innerText = '⏳ กำลังบันทึกคะแนนลงระบบ...';
        stat.style.color = '#d97706';

        fetch(QUIZ_CONFIG.SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                name: localStorage.getItem('studentName'),
                room: localStorage.getItem('studentRoom'),
                studentId: "'" + localStorage.getItem('studentId'),
                lesson: TOPIC_NAME,
                score: finalScore,
                maxScore: baseQuestions.length
            })
        }).catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = '✅ บันทึกคะแนนลงระบบเรียบร้อย!';
            stat.style.color = '#15803d';
            playAgainBtn.disabled = false;
        }, 1500);
    }
</script>
</body>
</html>
